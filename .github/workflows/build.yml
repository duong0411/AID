name: Build APK & IPA

on:
  push:
    branches: [smart-first-aid-app]
  pull_request:
    branches: [smart-first-aid-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SmartFirstAid.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-first-aid-apk
          path: dist/SmartFirstAid.apk

  ios-ipa:
    name: iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p dist Payload
          APP_PATH=""
          for candidate in \
            build/ios/iphoneos/Runner.app \
            build/ios/Release-iphoneos/Runner.app \
            "$(find build/ios -name 'Runner.app' -type d | head -n 1)"; do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found"
            find build/ios -maxdepth 5 -type d -print || true
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf Payload/*
          cp -R "$APP_PATH" Payload/
          (cd . && zip -qry dist/SmartFirstAid.ipa Payload)
          ls -lh dist/SmartFirstAid.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-first-aid-ipa
          path: dist/SmartFirstAid.ipa

  release:
    name: GitHub Release
    needs: [android-apk, ios-ipa]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: smart-first-aid-apk
          path: dist

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: smart-first-aid-ipa
          path: dist

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Smart First AID app v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/SmartFirstAid.apk
            dist/SmartFirstAid.ipa
          body: |
            ## Tai app (nhanh `smart-first-aid-app`)
            - **Android APK:** `SmartFirstAid.apk`
            - **iOS IPA:** `SmartFirstAid.ipa` — ban CI chua codesign

            ## Smart First AID
            App Flutter theo doi nhip tim, SpO2, luc ep va rung tren ESP32.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
